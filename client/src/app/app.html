@if(haySesion()) {
  <app-nav />
}

<router-outlet />

@if(mostrarModalSesion()) {
  <div class="modal-fondo">
    <div class="modal">
      <h2>Sesión por vencer</h2>
      <p>Tu sesión vence en 5 minutos. ¿Querés extenderla?</p>
      <button (click)="extenderSesion()">Extender sesión</button>
      <button (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
}
